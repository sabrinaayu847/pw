<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Manajemen Bagasi Bandara</title>

    <style>
        :root{
            --primary:#2563eb;
            --primary-hover:#1d4ed8;
            --danger:#ef4444;
            --secondary:#64748b;
            --bg:#f1f5f9;
            --card:#ffffff;
            --border:#cbd5e1;
            --text:#1e293b;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            background:var(--bg);
            color:var(--text);
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#0f172a;
        }

        .container{
            max-width:1300px;
            margin:auto;
            display:grid;
            grid-template-columns:1fr 2fr;
            gap:25px;
        }

        @media(max-width:900px){
            .container{
                grid-template-columns:1fr;
            }
        }

        .card{
            background:var(--card);
            border-radius:10px;
            padding:25px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        .card h2{
            margin-bottom:20px;
            border-bottom:2px solid #e2e8f0;
            padding-bottom:10px;
            color:#0f172a;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
        }

        .form-control{
            width:100%;
            padding:10px;
            border:1px solid var(--border);
            border-radius:6px;
            font-size:15px;
        }

        .form-control:focus{
            outline:none;
            border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(37,99,235,0.15);
        }

        .btn-group{
            display:flex;
            gap:10px;
            margin-top:20px;
        }

        .btn{
            flex:1;
            border:none;
            padding:10px;
            border-radius:6px;
            cursor:pointer;
            font-weight:600;
            color:white;
            transition:0.2s;
        }

        .btn-primary{
            background:var(--primary);
        }

        .btn-primary:hover{
            background:var(--primary-hover);
        }

        .btn-danger{
            background:var(--danger);
        }

        .btn-danger:hover{
            background:#dc2626;
        }

        .btn-secondary{
            background:var(--secondary);
        }

        .btn-secondary:hover{
            background:#475569;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:12px;
            border-bottom:1px solid #e2e8f0;
            text-align:left;
        }

        th{
            background:#f8fafc;
        }

        tbody tr{
            cursor:pointer;
            transition:0.2s;
        }

        tbody tr:hover{
            background:#e0f2fe;
        }

        tbody tr.selected{
            background:#dbeafe;
        }

        .table-container{
            overflow-x:auto;
        }
    </style>
</head>
<body>

    <h1>Sistem Manajemen Bagasi Bandara</h1>

    <div class="container">

        <!-- FORM -->
        <div class="card">
            <h2>Tambah / Edit Data Bagasi</h2>

            <form id="bagasiForm">

                <div class="form-group">
                    <label>ID Bagasi</label>
                    <input type="text" id="idBagasi" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Nama Penumpang</label>
                    <input type="text" id="namaPenumpang" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Maskapai</label>
                    <select id="maskapai" class="form-control">
                        <option>Garuda Indonesia</option>
                        <option>Lion Air</option>
                        <option>Citilink</option>
                        <option>AirAsia</option>
                        <option>Batik Air</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Berat Bagasi (Kg)</label>
                    <input type="number" id="beratBagasi" class="form-control" required />
                </div>

                <div class="form-group">
                    <label>Status Bagasi</label>
                    <select id="statusBagasi" class="form-control">
                        <option>Check-in</option>
                        <option>Dalam Proses</option>
                        <option>Sudah Dimuat</option>
                        <option>Terkirim</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">
                        Simpan
                    </button>

                    <button type="button" class="btn btn-danger" id="btnHapus">
                        Hapus
                    </button>

                    <button type="reset" class="btn btn-secondary" id="btnReset">
                        Reset
                    </button>
                </div>

            </form>
        </div>

        <!-- TABLE -->
        <div class="card">
            <h2>Daftar Bagasi Bandara (Klik Baris untuk Edit)</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID Bagasi</th>
                            <th>Nama Penumpang</th>
                            <th>Maskapai</th>
                            <th>Berat</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

<script>
    let dataBagasi = JSON.parse(localStorage.getItem("DataBagasi")) || [];

    const form = document.getElementById("bagasiForm");
    const tableBody = document.getElementById("tableBody");
    const btnHapus = document.getElementById("btnHapus");

    let selectedId = null;

    function tampilkanData() {
        tableBody.innerHTML = "";

        dataBagasi.forEach((item) => {

            let row = `
                <tr onclick="editData('${item.idBagasi}')">
                    <td>${item.idBagasi}</td>
                    <td>${item.namaPenumpang}</td>
                    <td>${item.maskapai}</td>
                    <td>${item.beratBagasi} Kg</td>
                    <td>${item.statusBagasi}</td>
                </tr>
            `;

            tableBody.innerHTML += row;
        });

        localStorage.setItem("DataBagasi", JSON.stringify(dataBagasi));
    }

    form.addEventListener("submit", function(e){
        e.preventDefault();

        const data = {
            idBagasi: document.getElementById("idBagasi").value,
            namaPenumpang: document.getElementById("namaPenumpang").value,
            maskapai: document.getElementById("maskapai").value,
            beratBagasi: document.getElementById("beratBagasi").value,
            statusBagasi: document.getElementById("statusBagasi").value
        };

        if(selectedId){
            const index = dataBagasi.findIndex(item => item.idBagasi === selectedId);
            dataBagasi[index] = data;
            selectedId = null;
        } else {
            dataBagasi.push(data);
        }

        tampilkanData();
        form.reset();
    });

    function editData(id){
        const data = dataBagasi.find(item => item.idBagasi === id);

        document.getElementById("idBagasi").value = data.idBagasi;
        document.getElementById("namaPenumpang").value = data.namaPenumpang;
        document.getElementById("maskapai").value = data.maskapai;
        document.getElementById("beratBagasi").value = data.beratBagasi;
        document.getElementById("statusBagasi").value = data.statusBagasi;

        selectedId = id;
    }

    btnHapus.addEventListener("click", function(){

        if(selectedId){
            dataBagasi = dataBagasi.filter(item => item.idBagasi !== selectedId);

            tampilkanData();
            form.reset();

            selectedId = null;
        } else {
            alert("Pilih data terlebih dahulu!");
        }
    });

    tampilkanData();
</script>

</body>
</html>
