<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventaris Barang Premium</title>
    <style>
        /* Pengaturan Dasar Modern */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc; /* Latar belakang slate abu-abu super terang */
            color: #1e293b;
            padding: 50px 20px;
        }

        /* Judul Utama */
        h1.main-title {
            text-align: center;
            color: #312e81; /* Indigo gelap */
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        /* Container Flexbox */
        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }

        /* Desain Kartu Baru */
        .card {
            background-color: #ffffff;
            border-radius: 12px; /* Lebih melengkung */
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.04); /* Bayangan lebih halus */
            border: 1px solid #f1f5f9;
        }

        .form-section {
            flex: 1; 
            min-width: 320px;
        }

        .table-section {
            flex: 2; 
        }

        /* Judul di dalam kartu */
        .card h2 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #0f172a;
            position: relative;
            padding-bottom: 8px;
        }

        /* Garis dekoratif kecil di bawah judul kartu */
        .card h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 3px;
            background-color: #4f46e5; /* Aksen Indigo */
            border-radius: 2px;
        }

        /* Elemen Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px; /* Lebih bulat */
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc; /* Form background sedikit abu agar kontras */
            outline: none;
            transition: all 0.2s ease;
        }

        /* Efek fokus input yang lebih glowing */
        .form-group input:focus, 
        .form-group select:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Grup Tombol */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #4f46e5; /* Indigo */
            color: white;
        }

        .btn-primary:hover {
            background-color: #4338ca;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background-color: #e2e8f0; 
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        /* Desain Tabel Modern */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead {
            background-color: #f8fafc; 
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #edf2f7;
        }

        td {
            padding: 16px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f1f5f9; 
        }

        /* Styling Kapsul/Badge Status */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .badge-tersedia {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-habis {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
        }

        /* Responsif Layar Kecil */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .form-section, .table-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1 class="main-title">Manajemen Inventaris Barang</h1>

    <div class="container">
        
        <div class="card form-section">
            <h2 id="form-title">Tambah / Edit Barang</h2>
            
            <form id="formBarang">
                <input type="hidden" id="edit_index" value="">

                <div class="form-group">
                    <label for="id_barang">ID Barang</label>
                    <input type="text" id="id_barang" placeholder="Contoh: BRG001" required>
                </div>

                <div class="form-group">
                    <label for="nama_barang">Nama Barang</label>
                    <input type="text" id="nama_barang" placeholder="Masukkan nama barang..." required>
                </div>

                <div class="form-group">
                    <label for="kategori_barang">Kategori Barang</label>
                    <input type="text" id="kategori_barang" placeholder="Contoh: Elektronik, Pakaian..." required>
                </div>

                <div class="form-group">
                    <label for="status_stok">Status Stok</label>
                    <select id="status_stok">
                        <option value="Tersedia">Tersedia</option>
                        <option value="Habis">Habis</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <button type="button" id="btnReset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>

        <div class="card table-section">
            <h2>Daftar Barang (Klik baris untuk Edit)</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>ID Barang</th>
                        <th>Nama Barang</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelBarangBody">
                    <tr>
                        <td colspan="3" class="empty-state">Tidak ada data ditemukan.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Menggunakan LocalStorage agar data awet tidak hilang saat di-refresh
        let databaseBarang = JSON.parse(localStorage.getItem('gudangBarangAesthetic')) || [];

        const form = document.getElementById('formBarang');
        const tabelBody = document.getElementById('tabelBarangBody');
        const editIndexInput = document.getElementById('edit_index');
        const btnReset = document.getElementById('btnReset');
        const idBarangInput = document.getElementById('id_barang');

        function renderTabel() {
            tabelBody.innerHTML = ''; 

            if (databaseBarang.length === 0) {
                tabelBody.innerHTML = `
                    <tr>
                        <td colspan="3" class="empty-state">Tidak ada data ditemukan.</td>
                    </tr>
                `;
                return;
            }

            databaseBarang.forEach((barang, index) => {
                const row = document.createElement('tr');
                row.setAttribute('onclick', `siapkanEdit(${index})`); 
                
                // Cek status untuk memberikan class warna badge yang sesuai
                const badgeClass = barang.status === 'Tersedia' ? 'badge-tersedia' : 'badge-habis';

                row.innerHTML = `
                    <td><span style="color: #4f46e5; font-weight: 600;">${barang.id}</span></td>
                    <td>${barang.nama}</td>
                    <td><span class="badge ${badgeClass}">${barang.status}</span></td>
                `;
                tabelBody.appendChild(row);
            });
        }

        function simpanKeLocalStorage() {
            localStorage.setItem('gudangBarangAesthetic', JSON.stringify(databaseBarang));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault(); 

            const id = idBarangInput.value;
            const nama = document.getElementById('nama_barang').value;
            const kategori = document.getElementById('kategori_barang').value;
            const status = document.getElementById('status_stok').value;
            const editIndex = editIndexInput.value;

            const dataBaru = { id, nama, kategori, status };

            if (editIndex === "") {
                const idSama = databaseBarang.some(b => b.id.toLowerCase() === id.toLowerCase());
                if (idSama) {
                    alert("ID Barang ini sudah terdaftar. SIlakan gunakan ID lain!");
                    return;
                }
                databaseBarang.push(dataBaru);
            } else {
                databaseBarang[editIndex] = dataBaru;
                editIndexInput.value = ""; 
                idBarangInput.removeAttribute('readonly'); 
            }

            simpanKeLocalStorage(); 
            form.reset(); 
            renderTabel(); 
        });

        function siapkanEdit(index) {
            const barangTerpilih = databaseBarang[index];
            
            document.getElementById('id_barang').value = barangTerpilih.id;
            document.getElementById('nama_barang').value = barangTerpilih.nama;
            document.getElementById('kategori_barang').value = barangTerpilih.kategori;
            document.getElementById('status_stok').value = barangTerpilih.status;
            
            editIndexInput.value = index; 
            idBarangInput.setAttribute('readonly', true); 
        }

        btnReset.addEventListener('click', function() {
            form.reset();
            editIndexInput.value = "";
            idBarangInput.removeAttribute('readonly');
        });

        renderTabel();
    </script>
</body>
</html>
